version: "3.9"

services:
  backend:
    build:
      context: .
      target: backend
    container_name: lexar-backend
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CORS_ORIGINS=http://localhost:8501,http://frontend:8501
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      target: frontend
    container_name: lexar-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lexar-data:
