[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexar-ai"
version = "1.1.1"
description = "LEXAR: Legal Explainable Augmented Reasoner - A retrieval-augmented generation system for legal question answering with strict evidence grounding"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

authors = [
    { name = "Garv Behl", email = "behlgarv@gmail.com" }
]

maintainers = [
    { name = "Garv Behl", email = "behlgarv@gmail.com" }
]

keywords = [
    "legal-ai",
    "rag",
    "retrieval-augmented-generation",
    "llm",
    "legal-nlp",
    "explainable-ai",
    "evidence-grounding"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    "transformers>=4.30.0,<5.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.21.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.0.0",
]

gpu = [
    "torch>=2.0.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

all = [
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/garvbehl23/legalrag"
Documentation = "https://github.com/garvbehl23/legalrag#readme"
Repository = "https://github.com/garvbehl23/legalrag"
Issues = "https://github.com/garvbehl23/legalrag/issues"

[project.scripts]
lexar = "lexar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lexar*"]
exclude = ["backend*", "scripts*", "data*", "evaluation*"]

[tool.setuptools.package-data]
lexar = ["py.typed"]
