name: CI

on:
  push:
    branches: [ "main", "dev", "production-ready" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU-only torch to avoid huge GPU wheel in CI
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install -e . --no-deps

    - name: Lint (syntax + undefined names only)
      run: |
        pip install flake8
        flake8 lexar/ backend/ tests/ \
          --count --select=E9,F63,F7,F82 \
          --show-source --statistics

    - name: Run tests
      run: |
        pip install pytest pytest-cov
        pytest tests/ -v --tb=short \
          --ignore=tests/test_api.py \
          -k "not (test_upload or test_query)"
      env:
        PYTHONPATH: .

    - name: Run API tests (fast, no model load)
      run: |
        pytest tests/test_api.py -v --tb=short \
          -k "test_health or test_upload_rejects"
      env:
        PYTHONPATH: .
